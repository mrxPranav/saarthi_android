plugins {
    alias(libs.plugins.android.application)
}

// API settings come from local.properties (git-ignored), e.g.:
//   api.baseUrl=https://saarthi-gateway.saarthiapi.workers.dev/
//   api.key=your-api-key
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def apiBaseUrl = localProps.getProperty("api.baseUrl", "https://saarthi-gateway.saarthiapi.workers.dev/")
def apiKey = localProps.getProperty("api.key", "")

android {
    namespace "com.pranav.saarthi"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.pranav.saarthi"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        buildConfigField "String", "API_KEY", "\"${apiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1,DEPENDENCIES,LICENSE,NOTICE,LICENSE.txt,NOTICE.txt,INDEX.LIST}"]
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.cardview:cardview:1.0.0"

    // Retrofit & Gson
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.11.0"

    // Google Play Services and Drive API
    implementation "com.google.android.gms:play-services-auth:21.3.0"
    implementation "com.google.http-client:google-http-client-android:1.45.0"
    implementation "com.google.http-client:google-http-client-gson:1.45.0"
    implementation "com.google.api-client:google-api-client-android:2.7.0"
    implementation "com.google.apis:google-api-services-drive:v3-rev20230822-2.0.0"

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // WorkManager
    implementation "androidx.work:work-runtime:2.9.0"
}
